name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g pnpm

      - run: pnpm install --frozen-lockfile

      - name: Static export build
        run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      - name: Fix raw video path for Pages subpath
        run: grep -rl '/blog/shortcuts/procedure.mp4' out | xargs sed -i 's|/blog/shortcuts/procedure.mp4|/szhb/blog/shortcuts/procedure.mp4|g'

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
